<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Employee Login</title>

    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/login.css">

</head>

<body>

<div class="container">

    <div class="card">

        <h1>Employee Login</h1>

        <form action="../login" method="post">

            <label for="employeeId">
                Employee ID
            </label>

            <input
                    type="text"
                    id="employeeId"
                    name="employeeId"
                    required>

            <label for="password">
                Password
            </label>

            <input
                    type="password"
                    id="password"
                    name="password"
                    required>

            <button type="submit">
                Login
            </button>

            <button
                    type="button"
                    onclick="window.location.href='register.html'">
                Create New Account
            </button>

        </form>

    </div>

</div>

</body>

</html>
